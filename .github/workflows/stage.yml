# Stage: build and push Docker images only. No .env used here.
# Deploy (deploy.yml) runs on the server and uses prod/.env.prod (see deploy step summary).
name: Stage

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase owner; github.repository_owner may contain uppercase.
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase owner
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Bootstrap
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/bootstrap/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-bootstrap:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-bootstrap:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cp/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-cp:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-cp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push DP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dp/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-dp:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-dp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin Portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/admin-portal/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-admin-portal:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-admin-portal:latest
          build-args: |
            NEXT_PUBLIC_CP_API_URL=https://manager.vizeself.com
            NEXT_PUBLIC_API_URL=https://manager.vizeself.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Staff Portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/staff-portal/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-staff-portal:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-staff-portal:latest
          build-args: |
            NEXT_PUBLIC_CP_API_URL=https://portal.vizeself.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Mock Portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/mock-portal/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-mock-portal:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-mock-portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
