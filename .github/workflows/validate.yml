# Validate: run tests (unit + E2E). Triggered after Stage succeeds, or manually.
# Gate: repo variable VALIDATE_REQUIRE_APPROVAL = "true" → uses environment "test" (add Required reviewers in Settings → Environments).
#       VALIDATE_REQUIRE_APPROVAL = "false" or unset → uses "test-auto" (no approval). Create both environments.
name: Validate

on:
  workflow_run:
    workflows: [Stage]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: ${{ vars.VALIDATE_REQUIRE_APPROVAL == 'true' && 'test' || 'test-auto' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test --workspaces --if-present

  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Optional: run E2E when test stack is up (e.g. after stage deploys to test)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Start services (compose)
        run: |
          cd infra/docker/test
          cp .env.example .env
          docker compose up -d
          sleep 30
          docker compose ps

      - name: Run E2E
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3001
          E2E_MOCK_PORTAL_URL: http://localhost:3004
        continue-on-error: true

      - name: Show logs on failure
        if: failure()
        run: cd infra/docker/test && docker compose logs --tail=200

      - name: Teardown
        if: always()
        run: cd infra/docker/test && docker compose down -v
