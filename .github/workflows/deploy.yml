# Deploy: promote to production. Triggered after Stage succeeds, or manually.
# NOTE: Validate (E2E) pipeline is disabled until unit/E2E tests are properly written.
#       When tests are ready, switch workflow_run back to [Validate].
# Gate: repo variable DEPLOY_REQUIRE_APPROVAL = "true" → uses environment "production" (add Required reviewers).
#       DEPLOY_REQUIRE_APPROVAL = "false" or unset → uses "production-auto" (no approval). Create both environments.
#
# Required secrets (Settings → Secrets → Actions):
#   PROD_SSH_HOST      — server IP or hostname
#   PROD_SSH_USER      — SSH user (e.g. ubuntu or deploy)
#   PROD_SSH_KEY       — private key (PEM)
#   PROD_SSH_PORT      — SSH port (default 22), optional
#
# Server setup (one-time):
#   mkdir -p ~/visa-automation-env
#   cp .env.prod.example ~/visa-automation-env/.env.prod   # fill in secrets
#   chmod 600 ~/visa-automation-env/.env.prod
#   # No git clone needed — CI pushes infra files via scp on every deploy.
name: Deploy

on:
  workflow_run:
    workflows: [Stage]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (SHA or 'latest')"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  # Infra files are placed here on the server by scp; .env.prod lives alongside.
  DEPLOY_DIR: "$HOME/visa-automation-infra"

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: ${{ vars.DEPLOY_REQUIRE_APPROVAL == 'true' && 'production' || 'production-auto' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag and owner
        id: meta
        run: |
          TAG="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.image_tag || 'latest' }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT

      - name: Copy infra files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          source: "infra/docker/prod/compose.yml,infra/docker/prod/prod-override.yml,infra/docker/services,infra/caddy"
          target: "${{ env.DEPLOY_DIR }}"
          strip_components: 0

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            ENV_FILE="$HOME/visa-automation-env/.env.prod"
            COMPOSE_DIR="${DEPLOY_DIR}/infra/docker/prod"

            cd "${COMPOSE_DIR}"

            # Log in to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Export image tags
            export IMAGE_BOOTSTRAP=${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-bootstrap:${{ steps.meta.outputs.tag }}
            export IMAGE_CP=${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-cp:${{ steps.meta.outputs.tag }}
            export IMAGE_DP=${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-dp:${{ steps.meta.outputs.tag }}
            export IMAGE_ADMIN_PORTAL=${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-admin-portal:${{ steps.meta.outputs.tag }}
            export IMAGE_STAFF_PORTAL=${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-staff-portal:${{ steps.meta.outputs.tag }}
            export IMAGE_MOCK_PORTAL=${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-mock-portal:${{ steps.meta.outputs.tag }}

            # Pull new images
            docker-compose --env-file "${ENV_FILE}" -f compose.yml -f prod-override.yml pull

            # Rolling restart
            docker-compose --env-file "${ENV_FILE}" -f compose.yml -f prod-override.yml up -d --no-build --remove-orphans

            # Cleanup old images
            docker image prune -f

      - name: Deployment summary
        run: |
          echo "## ✅ Deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Owner:** \`${{ steps.meta.outputs.owner }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images deployed:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-bootstrap:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-cp:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-dp:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-admin-portal:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-staff-portal:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/visa-mock-portal:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
