# Admin Portal (Next.js) - single service file. Values from env.
services:
  admin-portal:
    build:
      context: ../../..
      dockerfile: apps/web/admin-portal/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_CP_API_URL: ${NEXT_PUBLIC_CP_API_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ${IMAGE_ADMIN_PORTAL}
    container_name: visa-admin-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CP_API_URL: ${NEXT_PUBLIC_CP_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    expose:
      - "3002"
    depends_on:
      cp:
        condition: service_healthy
    networks:
      - visa-network
