# Staff Portal (Next.js) - single service file. Values from env.
services:
  staff-portal:
    build:
      context: ../../..
      dockerfile: apps/web/staff-portal/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_CP_API_URL: ${NEXT_PUBLIC_STAFF_CP_API_URL:-https://portal.vizeself.com}
    image: ${IMAGE_STAFF_PORTAL}
    container_name: visa-staff-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CP_API_URL: ${NEXT_PUBLIC_STAFF_CP_API_URL:-https://portal.vizeself.com}
    expose:
      - "3003"
    depends_on:
      cp:
        condition: service_healthy
    networks:
      - visa-network
