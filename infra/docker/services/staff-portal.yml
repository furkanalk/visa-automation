# Staff Portal (Next.js) - single service file
services:
  staff-portal:
    build:
      context: ../../..
      dockerfile: apps/web/staff-portal/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_CP_API_URL: ${NEXT_PUBLIC_CP_API_URL:-http://localhost:3001}
    image: ${IMAGE_STAFF_PORTAL:-visa-automation/staff-portal:latest}
    container_name: visa-staff-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CP_API_URL: ${NEXT_PUBLIC_CP_API_URL:-http://localhost:3001}
    ports:
      - "3003:3003"
    depends_on:
      cp:
        condition: service_healthy
    networks:
      - visa-network
