services:
  postgres:
    image: postgres:16-alpine
    container_name: visa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-visa_automation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../packages/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-visa_automation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - visa-network

volumes:
  postgres_data:
