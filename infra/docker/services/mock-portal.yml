# Mock Portal (Express) - single service file, optional for E2E/dev
services:
  mock-portal:
    build:
      context: ../../..
      dockerfile: apps/web/mock-portal/Dockerfile
      target: production
    image: ${IMAGE_MOCK_PORTAL:-visa-automation/mock-portal:latest}
    container_name: visa-mock-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
    ports:
      - "3004:3004"
    networks:
      - visa-network
