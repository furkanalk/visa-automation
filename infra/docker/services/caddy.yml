# Caddy: public reverse proxy and TLS. Only this service exposes ports 80/443.
# Internal services (admin-portal, staff-portal, mock-portal, cp) use expose only.
# visa-dp has no exposure at all.
services:
  caddy:
    image: caddy:2-alpine
    container_name: visa-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cp:
        condition: service_healthy
      admin-portal:
        condition: service_started
      staff-portal:
        condition: service_started
    networks:
      - visa-network

volumes:
  caddy_data:
  caddy_config:
