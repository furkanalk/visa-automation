# Bootstrap: run DB migrations once after Postgres is healthy. All defaults live in Postgres (migrations).
# CP and DP depend on this so they start only after bootstrap has run.
# Path ../../../ is repo root when compose is run from infra/docker/{dev,test,prod}.
services:
  bootstrap:
    image: postgres:16-alpine
    container_name: visa-bootstrap
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Administrator}
    volumes:
      - ../../../:/workspace:ro
    working_dir: /workspace
    command: ["/bin/sh", "-c", "apk add --no-cache bash 2>/dev/null || true; /bin/bash /workspace/scripts/db/migrate.sh && /bin/bash /workspace/scripts/db/bootstrap-admin.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visa-network
