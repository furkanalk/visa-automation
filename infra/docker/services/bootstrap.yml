# Bootstrap: run DB migrations once after Postgres is healthy. All defaults live in Postgres (migrations).
# CP and DP depend on this so they start only after bootstrap has run.
# Migration SQL files and scripts are baked into the visa-bootstrap image (no repo mount needed).
services:
  bootstrap:
    image: ${IMAGE_BOOTSTRAP}
    container_name: visa-bootstrap
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PGPASSWORD: ${DB_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Administrator}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visa-network
