# Data Plane / worker (dp) - single service file
# All values from env (--env-file or env_file). No defaults; Telegram/notify from CP config.
services:
  dp:
    build:
      context: ../../..
      dockerfile: apps/dp/Dockerfile
      target: production
    image: ${IMAGE_DP}
    container_name: visa-dp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL}
      WORKER_ID: ${WORKER_ID}
      TENANT_ID: ${TENANT_ID}
      CP_API_URL: ${CP_API_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      CP_INTERNAL_SECRET: ${CP_INTERNAL_SECRET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      USE_MOCK_PORTAL: ${USE_MOCK_PORTAL}
      MOCK_PORTAL_BASE_URL: ${MOCK_PORTAL_BASE_URL}
      # MOCK_PORTAL_URL: legacy full-URL override (all portals same URL). Use MOCK_PORTAL_BASE_URL instead.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cp:
        condition: service_healthy
    networks:
      - visa-network
