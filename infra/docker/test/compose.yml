# Test (CI E2E / local) – run from infra/docker/test:
#   cp .env.test.example .env.test
#   ./up.sh   # pull+run, no build: docker compose --env-file .env.test -f compose.yml -f test-override.yml up -d --no-build
# Order: Postgres → bootstrap (migrate) → CP → DP.
name: visa-automation-test

include:
  - ../services/postgres.yml
  - ../services/redis.yml
  - ../services/bootstrap.yml
  - ../services/cp.yml
  - ../services/dp.yml
  - ../services/admin-portal.yml
  - ../services/staff-portal.yml
  - ../services/mock-portal.yml

networks:
  visa-network:
    name: visa-network-test
