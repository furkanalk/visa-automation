# Test-only overrides. Use: docker compose -f compose.yml -f test-override.yml up -d
# env_file: .env.test (bu klasördeki .env.test)
# Re-expose ports for E2E (base services use expose only when behind Caddy in prod).
services:
  postgres:
    env_file: .env.test
  redis:
    env_file: .env.test
  bootstrap:
    env_file: .env.test
  cp:
    env_file: .env.test
    ports:
      - "3001:3001"
    working_dir: /app
    volumes:
      - ../../..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
  dp:
    env_file: .env.test
    working_dir: /app
    volumes:
      - ../../..:/app
  admin-portal:
    env_file: .env.test
    ports:
      - "3002:3002"
  staff-portal:
    env_file: .env.test
    ports:
      - "3003:3003"
  mock-portal:
    env_file: .env.test
    ports:
      - "3004:3004"
