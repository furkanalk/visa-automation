# Prod-only overrides (security, env). Use: docker compose -f compose.yml -f prod-override.yml up -d
# env_file: .env.prod (bu klasördeki .env.prod)
services:
  postgres:
    env_file: .env.prod
    # ports: intentionally omitted — postgres must NOT be publicly exposed in prod.
    # Base postgres.yml binds ${DB_PORT}:5432; prod-override replaces it with expose-only.
    ports: []
    expose:
      - "5432"
    read_only: false
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  redis:
    env_file: .env.prod
    # ports: intentionally omitted — redis must NOT be publicly exposed in prod.
    ports: []
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    user: redis

  bootstrap:
    env_file: .env.prod

  cp:
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp

  dp:
    env_file: .env.prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
      - /home/pwuser/.cache

  admin-portal:
    env_file: .env.prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp

  staff-portal:
    env_file: .env.prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp

  caddy:
    env_file: .env.prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
