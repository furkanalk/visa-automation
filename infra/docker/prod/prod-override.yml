# Prod-only overrides (security, env). Use: docker compose -f compose.yml -f prod-override.yml up -d
# env_file: .env.prod (bu klasördeki .env.prod)
services:
  postgres:
    env_file: .env.prod
    read_only: false
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  redis:
    env_file: .env.prod
    security_opt:
      - no-new-privileges:true
    user: redis

  cp:
    env_file: .env.prod
    working_dir: /app
    volumes:
      - ../../..:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp

  dp:
    env_file: .env.prod
    working_dir: /app
    volumes:
      - ../../..:/app
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
      - /home/pwuser/.cache

  admin-portal:
    env_file: .env.prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp

  staff-portal:
    env_file: .env.prod
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
