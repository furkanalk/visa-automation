# Prod – run from infra/docker/prod:
#   cp .env.prod.example .env.prod  # set secrets!
#   ./up.sh   # pull+run, no build: docker compose --env-file .env.prod -f compose.yml -f prod-override.yml up -d --no-build
# Order: Postgres → bootstrap (migrate) → CP → DP.
name: visa-automation-prod

include:
  - ../services/postgres.yml
  - ../services/redis.yml
  - ../services/bootstrap.yml
  - ../services/cp.yml
  - ../services/dp.yml
  - ../services/admin-portal.yml
  - ../services/staff-portal.yml
  - ../services/caddy.yml

networks:
  visa-network:
    name: visa-network-prod
