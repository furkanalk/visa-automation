# Dev – run from infra/docker/dev:
#   cp .env.dev.example .env.dev
#   ./up.sh   # veya: docker compose --env-file .env.dev -f compose.yml -f dev-override.yml up -d --build --pull=never
# Order: Postgres → bootstrap (migrate) → CP → DP. All config defaults in Postgres.
name: visa-automation-dev

include:
  - ../services/postgres.yml
  - ../services/redis.yml
  - ../services/bootstrap.yml
  - ../services/cp.yml
  - ../services/dp.yml
  - ../services/admin-portal.yml
  - ../services/staff-portal.yml
  - ../services/mock-portal.yml

networks:
  visa-network:
    name: visa-network-dev
