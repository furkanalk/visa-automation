# Kong Declarative Configuration
# This file configures Kong in DB-less mode

_format_version: "3.0"
_transform: true

# ===========================================
# Services
# ===========================================
services:
  # API Service
  - name: visa-api
    url: http://api:3000
    connect_timeout: 5000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3

# ===========================================
# Routes
# ===========================================
routes:
  # Health check routes (public, no auth)
  - name: health-routes
    service: visa-api
    paths:
      - /health
    methods:
      - GET
    strip_path: false

  # API routes
  - name: api-routes
    service: visa-api
    paths:
      - /api
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    strip_path: false

# ===========================================
# Plugins (Global)
# ===========================================
plugins:
  # Request/Response logging
  - name: file-log
    config:
      path: /dev/stdout
      reopen: false

  # Rate limiting (global)
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # CORS
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
        - X-Tenant-ID
      exposed_headers:
        - X-Request-ID
        - X-Rate-Limit-Remaining
      credentials: true
      max_age: 3600

  # Request transformer (add headers)
  - name: request-transformer
    config:
      add:
        headers:
          - "X-Forwarded-By:kong"

# ===========================================
# Consumers (for future auth)
# ===========================================
# consumers:
#   - username: demo-tenant
#     keyauth_credentials:
#       - key: demo-api-key-12345

# ===========================================
# Upstreams (for load balancing/health checks)
# ===========================================
upstreams:
  - name: api-upstream
    algorithm: round-robin
    healthchecks:
      active:
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        http_path: /health/ready
        timeout: 3
      passive:
        healthy:
          successes: 2
        unhealthy:
          http_failures: 3
    targets:
      - target: api:3000
        weight: 100
